name: Validate Workout Picker 2.0

on:
  push:
    branches:
      - feat/workout-picker-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bootstrap patch
        run: python scripts/_apply_workout_picker_v2.py

      - name: Diff checks
        shell: bash
        run: |
          git diff --check
          git diff --check origin/main...HEAD
          if git diff origin/main...HEAD | grep '^+' | grep -q 'MutationObserver'; then
            echo 'Workout Picker 2.0 must not add MutationObserver'
            exit 1
          fi

      - name: GAS syntax check
        shell: bash
        run: |
          for f in src/*.gs; do
            cp "$f" /tmp/fitnessapp-check.js
            node --check /tmp/fitnessapp-check.js
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Verify product scope
        shell: bash
        run: |
          allowed='^(src/API\.gs|src/ExercisePickerV2\.gs|web/src/main\.js|web/src/workout-picker-v2\.js|web/src/workout-picker-v2\.css|web/src/workout-picker-v2\.test\.js|scripts/_apply_workout_picker_v2\.py|\.github/workflows/_validate_workout_picker_v2\.yml)$'
          bad=$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected files in Workout Picker 2.0 slice:"
            echo "$bad"
            exit 1
          fi

      - name: Commit validated product patch and cleanup
        shell: bash
        run: |
          rm .github/workflows/_validate_workout_picker_v2.yml
          rm scripts/_apply_workout_picker_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire Workout Picker 2.0 bootstrap [validated]'
          git push
