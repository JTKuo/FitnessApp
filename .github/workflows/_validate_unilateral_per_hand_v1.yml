name: Validate unilateral per-hand v1

on:
  push:
    branches:
      - feat/unilateral-per-hand-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product patch
        run: python scripts/_patch_unilateral_per_hand_v1.py

      - name: Diff check
        run: git diff --check

      - name: Guard against observer regression
        shell: bash
        run: |
          if git diff origin/main -- web src | grep '^+' | grep -q 'MutationObserver'; then
            echo 'New MutationObserver usage is forbidden in this slice.'
            exit 1
          fi

      - name: Structural semantics guards
        shell: bash
        run: |
          grep -q 'class="js-side-toggle workout-side-toggle hidden"' web/index.html
          grep -q 'load_mode: loadMode' web/src/methods.js
          grep -q 'side: side' web/src/methods.js
          grep -q "setFields.loadMode === 'per_hand'" src/Internal.gs
          grep -q 'persistedVolume' src/API.gs
          grep -q 'calculateSetVolumeKg' web/src/load-semantics.js
          grep -q "getLoadMultiplier('per_hand', 'both')" web/src/load-semantics.test.js

      - name: GAS syntax check
        shell: bash
        run: |
          for f in src/*.gs; do
            node -e "const fs=require('fs'); new Function(fs.readFileSync(process.argv[1],'utf8'));" "$f"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend install
        working-directory: web
        run: npm ci

      - name: Frontend tests
        working-directory: web
        run: npm run test

      - name: Frontend build
        working-directory: web
        run: npm run build

      - name: Commit validated product patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src web
          git commit -m 'feat: add unilateral and per-hand load semantics [validated]'

      - name: Remove temporary validator
        shell: bash
        run: |
          rm .github/workflows/_validate_unilateral_per_hand_v1.yml
          rm scripts/_patch_unilateral_per_hand_v1.py
          git add -A
          git commit -m 'chore: remove unilateral validator'
          git push origin HEAD:feat/unilateral-per-hand-v1
