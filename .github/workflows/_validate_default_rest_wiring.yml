name: Validate Per Exercise Rest Wiring

on:
  push:
    branches:
      - feat/new-exercise-setup

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[rest-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply rest wiring patch
        run: python scripts/_apply_default_rest_wiring.py

      - name: Guard scope and observers
        run: |
          git diff --name-only origin/main...HEAD > /tmp/branch-files.txt
          git diff --name-only >> /tmp/branch-files.txt
          sort -u /tmp/branch-files.txt | tee /tmp/changed.txt
          grep -Ev '^(web/src/(new-exercise-setup\.(js|css|test\.js)|workout-picker-v2\.js|api\.js|main\.js|methods\.js|rest-timer\.js|rest-timer\.test\.js)|src/(API\.gs|ExerciseMetadataSetup\.gs)|scripts/_apply_default_rest_wiring\.py|\.github/workflows/_validate_default_rest_wiring\.yml)$' /tmp/changed.txt > /tmp/unexpected.txt || true
          if [ -s /tmp/unexpected.txt ]; then
            echo 'Unexpected files:'
            cat /tmp/unexpected.txt
            exit 1
          fi
          if git diff origin/main -- web/src src | grep '^+' | grep -v '^+++' | grep -q 'MutationObserver'; then
            echo 'New MutationObserver is not allowed.'
            exit 1
          fi

      - name: Check GAS syntax
        run: |
          rm -rf /tmp/gas-js && mkdir -p /tmp/gas-js
          for f in src/*.gs; do cp "$f" "/tmp/gas-js/$(basename "${f%.gs}.js")"; done
          for f in /tmp/gas-js/*.js; do node --check "$f"; done

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Commit validated rest wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/new-exercise-setup.js web/src/methods.js web/src/rest-timer.js web/src/rest-timer.test.js src/ExerciseMetadataSetup.gs
          git commit -m 'feat: wire per-exercise default rest [rest-validated]'
          git push
