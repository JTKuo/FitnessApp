name: Validate InBody V3 mobile modal

on:
  push:
    branches:
      - feat/inbody-v3

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/_apply_inbody_v3_mobile_fix.py
      - run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm run test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Guard modal contract
        run: |
          grep -F 'max-h-[90vh] overflow-y-auto' web/index.html
          if git diff HEAD -- web/index.html | grep -q '^+.*MutationObserver'; then exit 1; fi
      - name: Cleanup and commit
        shell: bash
        run: |
          rm scripts/_apply_inbody_v3_mobile_fix.py
          rm .github/workflows/_validate_inbody_v3_mobile_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep InBody V3 modal usable on mobile [validated]'
          git push
