name: validate exercise metadata fast path

on:
  push:
    branches:
      - perf/exercise-metadata-fast-path

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: python scripts/_patch_exercise_metadata_fast_path.py

      - name: Validate diff
        run: git diff --check origin/main...HEAD

      - name: Validate GAS syntax
        run: |
          set -e
          for f in src/*.gs; do
            cp "$f" /tmp/check.js
            node --check /tmp/check.js
          done

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test frontend
        working-directory: web
        run: npm run test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Commit product patch and cleanup validator
        run: |
          rm scripts/_patch_exercise_metadata_fast_path.py
          rm .github/workflows/_validate_exercise_metadata_fast_path.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: avoid repeated ExerciseMaster migration [exercise-metadata-fast-path-validated]"
          git push
