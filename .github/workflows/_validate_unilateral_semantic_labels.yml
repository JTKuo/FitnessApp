name: Validate unilateral semantic labels

on:
  push:
    branches:
      - feat/unilateral-per-hand-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply semantic label fix
        run: python scripts/_fix_unilateral_semantic_labels.py
      - name: Diff check
        run: git diff --check
      - name: GAS syntax check
        shell: bash
        run: |
          for f in src/*.gs; do
            node -e "const fs=require('fs'); new Function(fs.readFileSync(process.argv[1],'utf8'));" "$f"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend install
        working-directory: web
        run: npm ci
      - name: Frontend tests
        working-directory: web
        run: npm run test
      - name: Frontend build
        working-directory: web
        run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web
          git commit -m 'fix: clarify per-hand and side labels [validated]'
      - name: Remove temporary validator
        shell: bash
        run: |
          rm .github/workflows/_validate_unilateral_semantic_labels.yml
          rm scripts/_fix_unilateral_semantic_labels.py
          git add -A
          git commit -m 'chore: remove unilateral semantic validator'
          git push origin HEAD:feat/unilateral-per-hand-v1
