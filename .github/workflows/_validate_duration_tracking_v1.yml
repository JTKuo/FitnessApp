name: Validate duration tracking v1

on:
  push:
    branches:
      - feat/duration-tracking-v1

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: ${{ !contains(github.event.head_commit.message, '[duration-v1-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/duration-tracking-v1
          fetch-depth: 0

      - name: Apply duration patch
        run: python scripts/_patch_duration_tracking_v1.py

      - name: Diff and scope guards
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --unified=0 origin/main -- web | grep -E '^\+.*MutationObserver'; then
            echo 'New MutationObserver is forbidden in duration slice.' >&2
            exit 1
          fi
          grep -q "js-duration-input" web/index.html
          grep -q "tracking_type: TRACKING_TYPE.DURATION" web/src/methods.js
          grep -q "exerciseCatalog" web/src/app.js
          grep -q "legacyReps" src/Internal.gs
          grep -q "trackingType !== 'weight_reps'" src/API.gs
          test -f web/src/tracking-type.test.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: GAS syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.gs; do
            cp "$f" /tmp/fitnessapp-check.js
            node --check /tmp/fitnessapp-check.js >/dev/null
          done

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: npm run test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Commit validated product patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_patch_duration_tracking_v1.py .github/workflows/_validate_duration_tracking_v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add duration tracking v1 [duration-v1-validated]"
          git push origin HEAD:feat/duration-tracking-v1
