name: Apply WorkoutLog V3 backend patch

on:
  push:
    branches: [feat/flexible-set-backend-foundation]

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[workoutlog-v3-backend-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flexible-set-backend-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply backend patch
        run: python scripts/_apply_workoutlog_v3_backend_patch.py
      - name: Check whitespace
        run: git diff --check origin/main...HEAD
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend regression tests
        working-directory: web
        run: npm run test
      - name: Build unchanged frontend
        working-directory: web
        run: npm run build
      - name: Remove temporary patch files
        run: rm scripts/_apply_workoutlog_v3_backend_patch.py .github/workflows/_apply_workoutlog_v3_backend_patch.yml
      - name: Commit validated backend patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire WorkoutLog V3 backend schema [workoutlog-v3-backend-validated]"
          git push origin HEAD:feat/flexible-set-backend-foundation
