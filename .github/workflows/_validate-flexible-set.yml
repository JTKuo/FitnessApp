name: Validate flexible set branch

on:
  push:
    branches: [feat/flexible-set-duration]

permissions:
  contents: write

jobs:
  test-build-cleanup:
    # Workflow already exists on this branch; this follow-up push is the validation trigger.
    if: ${{ !contains(github.event.head_commit.message, '[flexible-set-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flexible-set-duration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check whitespace
        run: git diff --check main...HEAD
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run tests
        working-directory: web
        run: npm run test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Remove temporary validation workflow
        run: rm .github/workflows/_validate-flexible-set.yml
      - name: Commit validation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete flexible set validation [flexible-set-validated]"
          git push origin HEAD:feat/flexible-set-duration
