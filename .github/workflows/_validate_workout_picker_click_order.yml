name: Validate Workout Picker click order

on:
  push:
    branches:
      - feat/workout-picker-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply click-order patch
        run: python scripts/_fix_workout_picker_click_order.py

      - name: Diff check
        run: git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Guard selection semantics
        shell: bash
        run: |
          grep -q "}, true);" web/src/workout-picker-v2.js
          if git diff origin/main...HEAD | grep '^+' | grep -q 'MutationObserver'; then
            echo 'Workout Picker 2.0 must not add MutationObserver'
            exit 1
          fi

      - name: Commit validated fix and cleanup
        shell: bash
        run: |
          rm .github/workflows/_validate_workout_picker_click_order.yml
          rm scripts/_fix_workout_picker_click_order.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: lock Workout Picker result selection [validated]'
          git push
