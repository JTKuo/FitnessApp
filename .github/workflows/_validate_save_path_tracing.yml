name: Validate workout save tracing

on:
  push:
    branches: [perf/save-path-tracing]

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[save-tracing-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/save-path-tracing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply tracing patch
        run: python scripts/_patch_save_path_tracing.py
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Check GAS JavaScript syntax
        run: |
          for f in src/*.gs; do
            cp "$f" /tmp/fitnessapp-check.js
            node --check /tmp/fitnessapp-check.js
          done
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend tests
        working-directory: web
        run: npm run test
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Remove temporary validator files
        run: rm scripts/_patch_save_path_tracing.py .github/workflows/_validate_save_path_tracing.yml
      - name: Commit validated tracing patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: instrument workout save path [save-tracing-validated]"
          git push origin HEAD:perf/save-path-tracing
