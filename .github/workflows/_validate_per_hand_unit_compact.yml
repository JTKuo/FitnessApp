name: Validate compact per-hand unit presentation

on:
  push:
    branches:
      - fix/per-hand-unit-compact

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply presentation patch
        run: python scripts/_apply_per_hand_unit_compact.py

      - name: Check diff
        run: git diff --check

      - name: Guard scope
        shell: bash
        run: |
          allowed='^(web/src/methods\.js|web/src/workout-draft\.js|web/src/style\.css|scripts/_apply_per_hand_unit_compact\.py|\.github/workflows/_validate_per_hand_unit_compact\.yml)$'
          bad=$(git diff --name-only HEAD | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:"
            echo "$bad"
            exit 1
          fi
          if git diff HEAD -- web/src/methods.js web/src/workout-draft.js web/src/style.css | grep -q 'MutationObserver'; then
            echo 'Presentation slice must not add MutationObserver'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Remove temporary validator files
        run: |
          rm scripts/_apply_per_hand_unit_compact.py
          rm .github/workflows/_validate_per_hand_unit_compact.yml

      - name: Commit validated presentation patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No validated changes to commit.'
            exit 0
          fi
          git commit -m 'fix: keep per-hand units compact [validated]'
          git push
