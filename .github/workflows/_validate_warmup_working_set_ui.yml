name: validate warmup working set ui

on:
  push:
    branches:
      - feat/warmup-working-set-ui

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply product patch
        run: python scripts/_patch_warmup_working_set_ui.py

      - name: Validate diff
        run: git diff --check origin/main...HEAD

      - name: Guard against observer-based UI regression
        run: |
          if git diff origin/main...HEAD -- web | grep '^+' | grep -v '^+++' | grep -q 'MutationObserver'; then
            echo 'Warmup slice must not introduce MutationObserver-based decoration.'
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test frontend
        working-directory: web
        run: npm run test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Commit product patch and cleanup validator
        run: |
          rm scripts/_patch_warmup_working_set_ui.py
          rm .github/workflows/_validate_warmup_working_set_ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add warmup and working set selector [warmup-working-set-ui-validated]"
          git push
