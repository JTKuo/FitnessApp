name: Validate workout set row polish

on:
  push:
    branches:
      - feat/workout-set-row-polish
    paths:
      - 'scripts/_patch_workout_set_row_polish.py'
      - '.github/workflows/_validate_workout_set_row_polish.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product patch
        run: python scripts/_patch_workout_set_row_polish.py

      - name: Guard scope and unsafe observer changes
        shell: bash
        run: |
          git diff --check
          if git diff -- web | grep '^+' | grep -v '^+++' | grep -q 'MutationObserver'; then
            echo 'Unexpected new MutationObserver in UI polish slice.'
            exit 1
          fi
          if git diff -- web/index.html | grep '^+' | grep -v '^+++' | grep -q 'js-copy-set'; then
            echo 'Copy action should not remain in visible redesigned footer.'
            exit 1
          fi
          grep -q 'SET 1' web/index.html
          grep -q '>訓練<' web/index.html
          grep -q 'workout-set-actions' web/index.html
          grep -q 'border-left: 1px solid rgba(255, 255, 255, 0.12) !important' web/src/style.css

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Commit validated product patch and remove validator
        shell: bash
        run: |
          rm -f .github/workflows/_validate_workout_set_row_polish.yml scripts/_patch_workout_set_row_polish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: polish workout set row hierarchy [validated]'
          git push
