name: Validate canonical workout interaction

on:
  push:
    branches:
      - feat/workout-interaction-canonical

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[workout-interaction-canonical-validated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply product patch
        run: python scripts/_patch_workout_interaction_canonical.py

      - name: Diff and scope guards
        run: |
          git diff --check

          # Do not reintroduce feature UI through new MutationObserver code.
          if git diff --unified=0 HEAD -- web | grep '^+' | grep -q 'MutationObserver'; then
            echo 'New MutationObserver code is not allowed in this slice.'
            exit 1
          fi

          grep -q 'workout-add-set-row' web/index.html
          ! grep -q 'js-start-timer' web/index.html
          grep -q 'resizeWorkoutNote(target)' web/src/events.js
          grep -q 'resizeWorkoutNotes(root = document)' web/src/methods.js
          grep -q 'data-set-type="working"' web/src/style.css
          grep -q 'js-complete-set:not' web/src/style.css
          grep -q 'workout-note::-webkit-scrollbar-button' web/src/style.css

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Commit validated product patch and cleanup validator
        run: |
          rm .github/workflows/_validate_workout_interaction_canonical.yml
          rm scripts/_patch_workout_interaction_canonical.py
          git add -A
          git commit -m "feat: canonicalize workout set interaction [workout-interaction-canonical-validated]"
          git push origin HEAD:feat/workout-interaction-canonical
