name: Validate duration semantic guards

on:
  push:
    branches:
      - feat/duration-tracking-v1

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[duration-semantics-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/duration-tracking-v1
          fetch-depth: 0

      - name: Apply semantic guards
        run: python scripts/_fix_duration_tracking_semantics.py

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q "trackingType === 'duration'" web/src/rest-timer.js
          grep -q "cachedCatalog.length > 0" web/src/methods.js
          if git diff --unified=0 origin/main -- web | grep -E '^\+.*MutationObserver'; then
            echo 'New MutationObserver is forbidden.' >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: GAS syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.gs; do cp "$f" /tmp/check.js; node --check /tmp/check.js >/dev/null; done

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Commit validated semantic fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_fix_duration_tracking_semantics.py .github/workflows/_validate_duration_semantics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align duration completion semantics [duration-semantics-validated]"
          git push origin HEAD:feat/duration-tracking-v1
