name: Validate Workout Picker Polish

on:
  push:
    branches:
      - feat/workout-picker-polish

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Guard scope
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/changed.txt
          grep -Ev '^(web/src/workout-picker-v2\.(js|css|test\.js)|src/ExerciseMasterV2\.gs|\.github/workflows/_validate_picker_polish\.yml)$' /tmp/changed.txt > /tmp/unexpected.txt || true
          if [ -s /tmp/unexpected.txt ]; then
            echo 'Unexpected files:'
            cat /tmp/unexpected.txt
            exit 1
          fi
          if git diff origin/main...HEAD -- web/src src | grep '^+' | grep -v '^+++' | grep -q 'MutationObserver'; then
            echo 'New MutationObserver is not allowed.'
            exit 1
          fi

      - name: Check GAS syntax
        run: |
          rm -rf /tmp/gas-js && mkdir -p /tmp/gas-js
          for f in src/*.gs; do
            cp "$f" "/tmp/gas-js/$(basename "${f%.gs}.js")"
          done
          for f in /tmp/gas-js/*.js; do node --check "$f"; done

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        run: npm run build
