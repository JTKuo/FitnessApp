name: Validate workout save latency patch

on:
  push:
    branches: [perf/workout-save-latency]

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[workout-save-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/workout-save-latency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply patch
        run: python scripts/_patch_workout_save_latency.py
      - name: Check whitespace
        run: git diff --check origin/main...HEAD
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run tests
        working-directory: web
        run: npm run test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Remove temporary validator
        run: rm scripts/_patch_workout_save_latency.py .github/workflows/_validate_workout_save_latency.yml
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: stop blocking workout save on PR processing [workout-save-validated]"
          git push origin HEAD:perf/workout-save-latency
